# Ezan Vakti tanitim sitesi. Statik, uygulama katmani yok.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /gizlilik -> gizlilik.html (App Store Connect'e yazilan adres uzantisiz).
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Coolify saglik denetimi bu ucu cekiyor; kok sayfayi derlemeden dondurur.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    gzip on;
    gzip_types text/css text/html application/javascript;
}
